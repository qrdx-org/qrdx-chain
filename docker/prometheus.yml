# Prometheus configuration for QRDX node monitoring
#
# The QRDX node exposes /metrics on its main HTTP port (QRDX_NODE_PORT, default
# 3007) — there is no separate metrics listener. Keep the target in sync with
# QRDX_NODE_PORT in docker-compose.prod.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

scrape_configs:
  # QRDX node metrics
  - job_name: "qrdx-node"
    static_configs:
      - targets: ["qrdx-node:3007"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
