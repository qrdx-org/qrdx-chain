# =============================================================================
# QRDX Production Stack — node + Prometheus + Grafana
#
#   cp config.example.toml docker/config.toml      # then edit for production
#   docker compose -f docker/docker-compose.prod.yml up -d
#   docker compose -f docker/docker-compose.prod.yml ps
#
# Secrets (QRDX_VALIDATOR_PASSWORD, GRAFANA_ADMIN_PASSWORD, ...) come from the
# environment or a .env file next to this compose file — never from the image.
#
# PORTS: the node exposes ONE HTTP port (QRDX_NODE_PORT). It carries the REST
# API, JSON-RPC at /rpc, Prometheus metrics at /metrics, /healthz, /readyz and
# the optional /ws + /stream feeds. There is no separate 8545/8546/9090 listener.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # QRDX Node
  # ---------------------------------------------------------------------------
  qrdx-node:
    # Production runs a VERIFIED release image, by digest (docs/RELEASES.md §5):
    #   scripts/release/verify-release.sh vX.Y.Z            # prints the image reference
    #   QRDX_IMAGE=ghcr.io/qrdx-org/qrdx-chain@sha256:… docker compose -f … up -d --no-build
    # `build:` is for development images only; a local build is not a release.
    build:
      context: ".."
      dockerfile: "docker/Dockerfile"
    image: ${QRDX_IMAGE:-qrdx-node:${QRDX_IMAGE_TAG:-latest}}
    container_name: qrdx-node
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 60s

    ports:
      - "${QRDX_NODE_PORT:-3007}:${QRDX_NODE_PORT:-3007}"

    volumes:
      # Chain database, PQ node identity and slashing-protection DB.
      - qrdx-data:/app/data
      # Node configuration. This file MUST exist before `up`:
      #   cp config.example.toml docker/config.toml
      # If it is missing, Docker creates a DIRECTORY at that path and the node
      # then fails to parse its config.
      - ./config.toml:/app/config.toml:ro
      #
      # TLS certificates and the validator wallet are OPTIONAL and therefore not
      # mounted here. A bind mount whose source does not exist makes Docker create
      # it, which on Docker Desktop / WSL fails outright ("error while creating
      # mount source path ... file exists"). Add them explicitly when you need
      # them, with the secrets overlay:
      #
      #   export QRDX_TLS_CERT_DIR=/etc/qrdx/certs        # for TLS
      #   export QRDX_VALIDATOR_WALLET_DIR=/etc/qrdx/wallet
      #   docker compose -f docker/docker-compose.prod.yml \
      #                  -f docker/docker-compose.prod-secrets.yml up -d

    environment:
      QRDX_CONFIG: "/app/config.toml"
      QRDX_DATA_DIR: "/app/data"
      QRDX_NODE_HOST: "0.0.0.0"
      QRDX_NODE_PORT: "${QRDX_NODE_PORT:-3007}"
      QRDX_DATABASE_PATH: "/app/data/qrdx.db"
      QRDX_NODE_KEY_DIR: "/app/data/keys"
      QRDX_SELF_URL: "${QRDX_SELF_URL:-}"
      QRDX_BOOTSTRAP_NODE: "${QRDX_BOOTSTRAP_NODE:-https://node.qrdx.network}"
      # The network's genesis file: its chain spec (chain id, consensus parameters, upgrade
      # schedule) and genesis allocations. Required — without it the node would start a dev
      # network of its own. Chain id and parameters come from this file, not the environment.
      QRDX_GENESIS_FILE: "${QRDX_GENESIS_FILE:-/app/data/genesis_config.json}"
      QRDX_LOG_LEVEL: "${QRDX_LOG_LEVEL:-INFO}"
      LOG_LEVEL: "${QRDX_LOG_LEVEL:-INFO}"
      QRDX_METRICS_ENABLED: "true"
      QRDX_RPC_ENABLED: "${QRDX_RPC_ENABLED:-true}"
      QRDX_ENABLE_STREAMING: "${QRDX_ENABLE_STREAMING:-}"
      # Validator (leave disabled on a plain full node)
      QRDX_VALIDATOR_ENABLED: "${QRDX_VALIDATOR_ENABLED:-false}"
      QRDX_VALIDATOR_WALLET: "${QRDX_VALIDATOR_WALLET:-}"
      # Secrets — from the environment only.
      QRDX_VALIDATOR_PASSWORD: "${QRDX_VALIDATOR_PASSWORD:-}"
      QRDX_RPC_ADMIN_TOKEN: "${QRDX_RPC_ADMIN_TOKEN:-}"
      QRDX_TLS_CERT: "${QRDX_TLS_CERT:-}"
      QRDX_TLS_KEY: "${QRDX_TLS_KEY:-}"

    deploy:
      resources:
        limits:
          cpus: "${QRDX_CPU_LIMIT:-4.0}"
          memory: "${QRDX_MEM_LIMIT:-4G}"
        reservations:
          cpus: "1.0"
          memory: "1G"

    healthcheck:
      test: ["CMD", "python", "/app/docker/docker-healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    # Unprivileged. The image's own user is the same; stating it here means no image run by
    # this file can quietly run the node as root. Bind-mounted data must be writable by it.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

    # NOTE: `read_only: true` is deliberately NOT set. The node writes its
    # slashing-protection database to the working directory, and losing that
    # file (or putting it on a tmpfs) would remove double-sign protection.
    # /app is owned by the unprivileged user instead.

    networks: [qrdx-net]

  # ---------------------------------------------------------------------------
  # Prometheus — metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: qrdx-prometheus
    restart: unless-stopped
    logging: *default-logging

    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"

    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

    depends_on:
      qrdx-node: { condition: service_started }

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

    networks: [qrdx-net]

  # ---------------------------------------------------------------------------
  # Grafana — dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: qrdx-grafana
    restart: unless-stopped
    logging: *default-logging

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"

    depends_on:
      prometheus: { condition: service_started }

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

    networks: [qrdx-net]

volumes:
  qrdx-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  qrdx-net:
    driver: bridge
