# =============================================================================
# Optional overlay for docker-compose.prod.yml — mounts TLS material and/or the
# validator wallet from the host.
#
#   export QRDX_TLS_CERT_DIR=/etc/qrdx/certs
#   export QRDX_VALIDATOR_WALLET_DIR=/etc/qrdx/wallet
#   export QRDX_VALIDATOR_WALLET=/app/wallet/validator.json
#
#   docker compose -f docker/docker-compose.prod.yml \
#                  -f docker/docker-compose.prod-secrets.yml up -d
#
# Both directories MUST already exist on the host. They are kept out of the base
# stack because a bind mount with a nonexistent source makes Docker create it,
# which fails on Docker Desktop / WSL and silently produces an empty directory
# elsewhere. Both variables are required here so a typo fails loudly.
#
# Mount directories, not individual files: a bind-mounted file that is later
# replaced (cert renewal) breaks the mount, while a directory survives it.
# =============================================================================

services:
  qrdx-node:
    volumes:
      - ${QRDX_TLS_CERT_DIR:?set QRDX_TLS_CERT_DIR to an EXISTING host directory holding your TLS certificate and key}:/app/certs:ro
      - ${QRDX_VALIDATOR_WALLET_DIR:?set QRDX_VALIDATOR_WALLET_DIR to an EXISTING host directory holding your validator wallet}:/app/wallet:ro
